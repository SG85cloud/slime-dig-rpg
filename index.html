<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>슬라임 지하 광산 굴착 RPG - 프로토타입</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "Malgun Gothic", sans-serif;
    color: #eee;
  }
  #title {
    margin: 16px 0 8px 0;
    font-size: 20px;
  }
  #game-wrap {
    position: relative;
    box-shadow: 0 0 24px rgba(0,0,0,0.6);
    user-select: none;
  }
  #help {
    margin: 10px 0 20px 0;
    font-size: 14px;
    color: #ccc;
    text-align: center;
    line-height: 1.6;
  }
  #help b { color: #ffd166; }

  /* ==================== 공통 RPG 창 스타일 ==================== */
  .rpg-window {
    position: absolute;
    background: rgba(20, 15, 10, 0.82);
    border: 2px solid #7a5a34;
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    font-size: 12px;
    z-index: 15;
  }
  .rpg-window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, #4a3620, #2e2013);
    border-bottom: 1px solid #7a5a34;
    padding: 5px 8px;
    font-size: 13px;
    color: #ffd166;
    border-radius: 4px 4px 0 0;
  }
  .win-close {
    background: none;
    border: none;
    color: #ddd;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
  }
  .win-close:hover { color: #ff8080; }
  .rpg-window-body { padding: 8px 10px; }

  /* ---- 캐릭터 상태창 ---- */
  #status-window { top: 12px; left: 12px; width: 230px; }
  .stat-line { margin-bottom: 6px; color: #f0e0c0; }
  .stat-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .stat-label { width: 22px; color: #ccc; }
  .stat-bar-bg {
    flex: 1;
    height: 10px;
    background: #2a2a2a;
    border: 1px solid #555;
    border-radius: 3px;
    overflow: hidden;
  }
  .stat-bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
  .stat-bar-fill.hp { background: linear-gradient(180deg, #6bdb6b, #2f8f4e); }
  .stat-bar-fill.sp { background: linear-gradient(180deg, #6bb9ff, #2f6f9f); }
  .stat-value { width: 62px; text-align: right; color: #ccc; font-size: 11px; }

  #status-reopen {
    display: none;
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(20,15,10,0.82);
    border: 2px solid #7a5a34;
    color: #ffd166;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    z-index: 15;
  }

  /* ---- 미니맵 ---- */
  #minimap-window { top: 12px; right: 12px; width: 148px; }
  #minimap-canvas { display: block; background: #0c0a08; border: 1px solid #555; border-radius: 3px; }
  .coord-text { margin-top: 4px; color: #9ad1ff; font-size: 11px; text-align: center; }

  /* ---- 채팅 / 로그 창 ---- */
  #chat-window { left: 12px; bottom: 64px; width: 320px; height: 150px; display: flex; flex-direction: column; }
  .chat-tabs { display: flex; border-bottom: 1px solid #7a5a34; }
  .chat-tab {
    flex: 1;
    background: #2e2013;
    color: #bbb;
    border: none;
    padding: 6px 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .chat-tab.active { background: rgba(20,15,10,0.82); color: #ffd166; }
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px;
    font-size: 12px;
    line-height: 1.5;
  }

  /* ---- 하단 퀵슬롯 바 ---- */
  #quickslot-bar {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: rgba(20,15,10,0.82);
    border: 2px solid #7a5a34;
    border-radius: 6px;
    padding: 5px;
    z-index: 15;
  }
  .quick-slot {
    width: 38px; height: 38px;
    background: #2a2118;
    border: 1px solid #6b4a30;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    position: relative;
  }
  .quick-slot.filled { border-color: #ffd166; }
  .slot-durability {
    position: absolute;
    bottom: -14px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    color: #9ad1ff;
  }

  /* ---- 우측 하단 메뉴 아이콘 ---- */
  #menu-icons {
    position: absolute;
    right: 12px;
    bottom: 8px;
    display: flex;
    gap: 6px;
    z-index: 15;
  }
  .menu-icon {
    width: 40px; height: 40px;
    background: rgba(20,15,10,0.82);
    border: 2px solid #7a5a34;
    border-radius: 6px;
    color: #eee;
    font-size: 18px;
    cursor: pointer;
  }
  .menu-icon:hover { border-color: #ffd166; }

  /* ---- 가방(인벤토리) 팝업 ---- */
  #inventory-modal { right: 12px; bottom: 56px; width: 210px; display: none; }
  .inv-row { display: flex; justify-content: space-between; padding: 3px 0; color: #ddd; }
  #inventory-modal hr { border: none; border-top: 1px solid #5a4a3a; margin: 6px 0; }

  /* ---- 상점 모달 오버레이 ---- */
  #shop-modal {
    display: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.68);
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  .shop-panel {
    width: 300px;
    background: #2b2320;
    border: 3px solid #6b4423;
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .shop-panel h2 { margin: 0 0 10px 0; font-size: 18px; color: #ffd166; text-align: center; }
  .shop-row { display: flex; justify-content: space-between; font-size: 13px; color: #ddd; margin: 3px 0; }
  .shop-panel hr { border: none; border-top: 1px solid #5a4a3a; margin: 10px 0; }
  .shop-btn {
    display: block; width: 100%; box-sizing: border-box; text-align: left;
    background: #4a3c2f; color: #fff; border: 1px solid #7a6248; border-radius: 6px;
    padding: 8px 10px; margin: 6px 0; font-size: 13px; cursor: pointer;
  }
  .shop-btn:hover:not(:disabled) { background: #5f4d3b; }
  .shop-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .shop-btn .cost { float: right; color: #ffd166; }
  #shop-msg { min-height: 18px; font-size: 12px; color: #ff9a76; text-align: center; margin-top: 4px; }
  #btn-close-shop { background: #6b2b2b; border-color: #a04b4b; text-align: center; }
  #btn-close-shop:hover { background: #833838; }
</style>
</head>
<body>

  <!-- 지상 거점 상점 모달 -->
  <div id="shop-modal">

      <h2>🏠 지상 거점 상점</h2>

<div id="help">
  바닥을 <b>좌클릭</b>하면 슬라임이 이동합니다. <b>암반(바위)</b>을 클릭하면 다가가서 자동으로 곡괭이질을 시작합니다.<br>
  부순 암반 자리에 떨어진 <b>광물</b>은 슬라임이 다가가면 자동으로 줍습니다. <b>포탈</b>을 클릭하면 거점 상점이 열립니다. 진행 상황은 자동 저장됩니다.

<!-- Phaser 3 라이브러리를 CDN에서 불러온다. 게임 스프라이트는 assets/ 폴더의 PNG를 사용한다. -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

<script>
/* =========================================================================
   슬라임 지하 광산 굴착 RPG - 쿼터뷰 갱도 프로토타입
   - 라그나로크 온라인풍 클래식 UI(상태창/채팅로그/퀵슬롯/미니맵) + 클릭 이동/채굴.
   - assets/ 폴더의 PNG 스프라이트를 this.load.image()로 불러와 사용한다.
   ========================================================================= */

/* -------------------------------------------------------------------------
   1. 기본 상수
   ------------------------------------------------------------------------- */
const ROOM_W = 800;
const ROOM_H = 600;
const MOVE_SPEED = 180;     // px/sec, 클릭 이동 속도
const MINE_APPROACH_DIST = 46; // 암반에서 이만큼 떨어진 위치까지 접근
const SHOP_APPROACH_DIST = 60;
const ROCK_HP = 5;          // 암반 한 칸을 부수는 데 필요한 타격 횟수
const BASE_CYCLE_MS = 1200; // 채굴 한 사이클(게이지 한 바퀴) 기본 시간
const SP_COST_PER_CYCLE = 5;
const SP_REGEN_PER_SEC = 1;
const PICKUP_RADIUS = 64;   // 드랍된 광물을 자동으로 줍는 거리 (채굴 접근 거리보다 넉넉하게)

const SAVE_KEY = "slime_dig_rpg_save_v3";

// 광물 종류: 이름 / 판매가 / 드랍 가중치(기본) / 파편·로그 색상
const ORE_TYPES = {
  iron:    { name: "철 광석", sell: 2,  weight: 70, color: 0xb0763c, logColor: "#7ec8e3" },
  silver:  { name: "은 광석", sell: 5,  weight: 24, color: 0xd7d7e0, logColor: "#e8e8ff" },
  mithril: { name: "미스릴", sell: 15, weight: 6,  color: 0x9b6bff, logColor: "#ffd166" },
};

/* -------------------------------------------------------------------------
   1b. 아이소메트릭 그리드 좌표계
   - (col, row) 그리드 칸을 다이아몬드 화면 좌표로 변환하는 2:1 아이소 투영.
   - 각 스프라이트의 표시 크기/기준점(origin)은 assets/ 원본 이미지에서
     실제 그림이 차지하는 영역(투명 여백 제외)을 측정해서 계산한 값이다.
   ------------------------------------------------------------------------- */
const GRID_COLS = 6;
const GRID_ROWS = 9;
const TILE_W = 96;          // 바닥 다이아몬드 한 칸의 화면 폭
const TILE_H = 48;          // 바닥 다이아몬드 한 칸의 화면 높이 (2:1 비율)
const GRID_ORIGIN_X = 472;  // 그리드 (0,0)칸 = 포탈이 놓이는 화면 좌표
const GRID_ORIGIN_Y = 180;
const SAFE_DEPTH = 2;       // col+row가 이 값 이하인 칸은 처음부터 뚫려있는 시작 빈터

const GRID_MIN_X = GRID_ORIGIN_X - (GRID_ROWS - 1) * (TILE_W / 2);
const GRID_MAX_X = GRID_ORIGIN_X + (GRID_COLS - 1) * (TILE_W / 2);
const GRID_MIN_Y = GRID_ORIGIN_Y;
const GRID_MAX_Y = GRID_ORIGIN_Y + (GRID_COLS - 1 + GRID_ROWS - 1) * (TILE_H / 2);

// 스프라이트별 표시 크기(px)와 origin(0~1). 전부 정사각 캔버스 이미지라 크기는 한 변 길이로 표현한다.
const FLOOR_DISPLAY  = 101; const FLOOR_ORIGIN_Y  = 0.48;
const ROCK_DISPLAY   = 110; const ROCK_ORIGIN_Y   = 0.84;
const PORTAL_DISPLAY = 195; const PORTAL_ORIGIN_Y = 0.85;
const LAMP_DISPLAY   = 120; const LAMP_ORIGIN_Y   = 0.825;
const SLIME_DISPLAY  = 119; const SLIME_ORIGIN_Y  = 0.75;
const ORE_ITEM_DISPLAY = 98; const ORE_ITEM_ORIGIN_Y = 0.68;

/* -------------------------------------------------------------------------
   2. 조명(Fog of War) 글로우 텍스처
   - 안개 마스크용 원형 그라디언트만 예외적으로 코드에서 생성한다.
     (일반 스프라이트가 아니라 블렌드용 광원 마스크라 PNG로 대체하지 않는다.)
   ------------------------------------------------------------------------- */

/** 랜턴 주변에 은은하게 퍼지는 원형 글로우 텍스처를 만든다 (동심원 여러 겹). */
function makeGlowTexture(scene, key, radius, color) {
  const g = scene.make.graphics({ x: 0, y: 0, add: false });
  const steps = 8;
  for (let i = steps; i >= 1; i--) {
    const r = radius * (i / steps);
    const alpha = 0.5 * Math.pow(1 - i / steps, 1.6) + 0.03;
    g.fillStyle(color, alpha);
    g.fillCircle(radius, radius, r);
  }
  g.generateTexture(key, radius * 2, radius * 2);
  g.destroy();
}

/* -------------------------------------------------------------------------
   3. 메인 게임 씬
   ------------------------------------------------------------------------- */
class MineScene extends Phaser.Scene {
  constructor() {
    super("MineScene");

    this.inventory = { iron: 0, silver: 0, mithril: 0 };
    this.rockBlocks = [];
    this.groundItems = [];
    this.miningTarget = null;
    this.mineProgress = 0;
    this.shopOpen = false;
    this.activeTab = "general";
    this.chatMessages = [];

    // 곡괭이 강화 단계표 (레벨, 비용)
    this.upgradeTiers = [
      { level: 1, cost: 0 },
      { level: 2, cost: 60 },
      { level: 3, cost: 150 },
      { level: 4, cost: 320 },
      { level: 5, cost: 600 },
    ];
    // 가방 확장 단계표
    this.bagTiers = [15, 25, 40, 60];
    this.bagCosts = [0, 80, 200, 400];
  }

  preload() {
    /* ---- assets/ 폴더의 고화질 픽셀 스프라이트를 불러온다 ---- */
    this.load.image("slime", "assets/slime.png");
    this.load.image("floor", "assets/floor.png");
    this.load.image("rock", "assets/rock.png");
    this.load.image("portal", "assets/portal.png");
    this.load.image("lamp", "assets/lamp.png");
    this.load.image("ore_item", "assets/ore_item.png");
  }

  create() {
    /* ---- 3-1. 조명 마스크 텍스처 생성 (안개용 글로우만 예외적으로 절차 생성) ---- */
    makeGlowTexture(this, "glow", 46, 0xffcf6b);

    /* ---- 3-2. 경제 상태 기본값 + 세이브 데이터 불러오기 ---- */
    this.gold = 0;
    this.bagLevel = 0;
    this.bagCapacity = this.bagTiers[this.bagLevel];
    this.pickaxeLevel = 1;
    this.pickaxeMaxDurability = 50;
    this.pickaxeDurability = this.pickaxeMaxDurability;
    this.level = 1;
    this.expPercent = 0;
    this.maxHP = 100; this.hp = 100;
    this.maxSP = 50; this.sp = 50;

    const saved = this.loadSaveData();
    if (saved) {
      this.gold = saved.gold ?? this.gold;
      this.bagLevel = saved.bagLevel ?? this.bagLevel;
      this.bagCapacity = this.bagTiers[this.bagLevel] ?? this.bagCapacity;
      this.pickaxeLevel = saved.pickaxeLevel ?? this.pickaxeLevel;
      this.pickaxeDurability = saved.pickaxeDurability ?? this.pickaxeDurability;
      this.inventory.iron = saved.inventory?.iron ?? 0;
      this.inventory.silver = saved.inventory?.silver ?? 0;
      this.inventory.mithril = saved.inventory?.mithril ?? 0;
      this.level = saved.level ?? this.level;
      this.expPercent = saved.expPercent ?? this.expPercent;
      this.maxHP = saved.maxHP ?? this.maxHP;
      this.hp = saved.hp ?? this.maxHP;
      this.maxSP = saved.maxSP ?? this.maxSP;
      this.sp = saved.sp ?? this.maxSP;
    }

    /* ---- 3-3. 아이소메트릭 바닥 그리드 + 암반(rock) 배치 ----
       그리드 전체에 바닥을 빈틈없이 깔고, 시작 빈터(SAFE_DEPTH 이내)를 제외한
       모든 칸에 rock 블록을 채워 아래로 내려가는 길을 가로막는다.
       depth를 화면 y좌표로 주면 위쪽 블록이 먼저, 아래쪽 블록이 나중에 그려져
       입체적인 원근감(자연스러운 겹침)이 생긴다. ---- */
    for (let row = 0; row < GRID_ROWS; row++) {
      for (let col = 0; col < GRID_COLS; col++) {
        const { x, y } = this.gridToScreen(col, row);
        this.add.image(x, y, "floor")
          .setOrigin(0.5, FLOOR_ORIGIN_Y)
          .setDisplaySize(FLOOR_DISPLAY, FLOOR_DISPLAY)
          .setDepth(-1000);

        if (col + row <= SAFE_DEPTH) continue; // 시작 빈터: 암반 없이 뚫려있는 칸

        const sprite = this.add.image(x, y, "rock")
          .setOrigin(0.5, ROCK_ORIGIN_Y)
          .setDisplaySize(ROCK_DISPLAY, ROCK_DISPLAY)
          .setDepth(y)
          .setInteractive({ useHandCursor: true, pixelPerfect: true }); // 이웃 타일과 사각 히트박스가 겹치지 않도록 픽셀 단위 판정
        const rock = { sprite, col, row, uses: ROCK_HP, maxUses: ROCK_HP, broken: false };
        sprite.on("pointerdown", () => this.onOreClicked(rock));
        this.rockBlocks.push(rock);
      }
    }

    /* ---- 3-4. 시작 지점: 포탈(거점 상점) + 랜턴 ---- */
    this.lampSpots = []; // 안개(어둠)에 뚫어둘 정적 조명 위치들
    const portalPos = this.gridToScreen(0, 0);
    this.shopSprite = this.add.image(portalPos.x, portalPos.y, "portal")
      .setOrigin(0.5, PORTAL_ORIGIN_Y)
      .setDisplaySize(PORTAL_DISPLAY, PORTAL_DISPLAY)
      .setDepth(portalPos.y)
      .setInteractive({ useHandCursor: true, pixelPerfect: true });
    this.add.text(portalPos.x, portalPos.y + 6, "상점", {
      fontSize: "12px", fontFamily: "Malgun Gothic, sans-serif", color: "#ffd166",
      stroke: "#2e2013", strokeThickness: 3,
    }).setOrigin(0.5, 0).setDepth(portalPos.y + 1);
    this.shopSprite.on("pointerdown", () => this.onShopClicked());
    this.lampSpots.push([portalPos.x, portalPos.y - 30]);

    [[1, 0], [0, 1]].forEach(([lcol, lrow]) => {
      const { x, y } = this.gridToScreen(lcol, lrow);
      this.add.image(x, y, "glow").setBlendMode(Phaser.BlendModes.ADD).setDepth(y + 1).setAlpha(0.85).setScale(1.1);
      const lamp = this.add.image(x, y, "lamp")
        .setOrigin(0.5, LAMP_ORIGIN_Y)
        .setDisplaySize(LAMP_DISPLAY, LAMP_DISPLAY)
        .setDepth(y + 2);
      this.tweens.add({ targets: lamp, alpha: 0.65, duration: 900, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
      this.lampSpots.push([x, y - 40]);
    });

    /* ---- 3-5. 슬라임 플레이어: 포탈 바로 앞 빈터에서 스폰 ---- */
    const spawnCell = this.gridToScreen(1, 1);
    const spawnX = saved?.playerX ?? spawnCell.x;
    const spawnY = saved?.playerY ?? spawnCell.y;
    this.player = this.add.image(spawnX, spawnY, "slime")
      .setOrigin(0.5, SLIME_ORIGIN_Y)
      .setDisplaySize(SLIME_DISPLAY, SLIME_DISPLAY)
      .setDepth(spawnY);

    // 채굴 진행 게이지 (플레이어 머리 위)
    this.gaugeBg = this.add.rectangle(0, 0, 40, 6, 0x222222).setOrigin(0, 0).setDepth(999).setVisible(false);
    this.gaugeFill = this.add.rectangle(0, 0, 40, 6, 0xffd166).setOrigin(0, 0).setDepth(1000).setVisible(false);

    /* ---- 3-7b. 동적 조명 + 암흑 시야(Fog of War) ----
       슬라임 안전모 랜턴을 중심으로 한 원형 빛만 밝게 보이고, 나머지는 짙은 어둠으로
       덮어 미지의 갱도를 탐험하는 분위기를 낸다. 안개는 매 프레임 다시 그리는
       RenderTexture이며, ERASE 블렌드로 빛이 닿는 자리에만 구멍을 뚫는다. */
    this.playerLight = this.add.image(this.player.x, this.player.y, "glow")
      .setBlendMode(Phaser.BlendModes.ADD)
      .setAlpha(0.85)
      .setScale(3.4)
      .setDepth(890);

    // 안개에 구멍을 뚫을 때 쓰는 스탬프 (화면에는 직접 그려지지 않는다)
    this.lightStampPlayer = this.make.image({ x: 0, y: 0, key: "glow" }, false);
    this.lightStampLamp = this.make.image({ x: 0, y: 0, key: "glow" }, false);

    this.fog = this.add.renderTexture(0, 0, ROOM_W, ROOM_H).setOrigin(0, 0).setDepth(2000);

    /* ---- 3-8. 입력: 바닥 클릭 = 이동, 오브젝트 클릭은 각자 핸들러가 처리 ---- */
    this.input.on("pointerdown", (pointer) => {
      if (this.shopOpen) return;
      const hits = this.input.hitTestPointer(pointer);
      if (hits.length > 0) return; // 광맥/상점 등 인터랙티브 오브젝트는 자체 핸들러가 처리
      this.moveTo(pointer.worldX, pointer.worldY, null);
    });

    this.input.keyboard.on("keydown-ESC", () => {
      if (this.shopOpen) this.closeShop();
    });

    /* ---- 3-9. 최초 안내 로그 ---- */
    this.addLog("슬라임 광부: 오늘도 열심히 캐보자~!", "#8fdc8f");

    /* ---- 3-10. UI 초기 갱신 + DOM 연결 ---- */
    window.gameScene = this;
    this.updateUI();
    this.renderChatLog();

    this.time.addEvent({ delay: 5000, loop: true, callback: () => this.saveGame() });
    this.time.addEvent({ delay: 900, loop: true, callback: () => this.ambientSparkle() });
    window.addEventListener("beforeunload", () => this.saveGame());
  }

  /* =========================================================================
     이동 / 채굴
     ========================================================================= */

  /** 그리드 (col,row)를 2:1 아이소메트릭 화면 좌표로 변환한다. */
  gridToScreen(col, row) {
    return {
      x: GRID_ORIGIN_X + (col - row) * (TILE_W / 2),
      y: GRID_ORIGIN_Y + (col + row) * (TILE_H / 2),
    };
  }

  clampToRoom(x, y) {
    const margin = 16;
    return {
      x: Phaser.Math.Clamp(x, GRID_MIN_X + margin, GRID_MAX_X - margin),
      y: Phaser.Math.Clamp(y, GRID_MIN_Y + margin, GRID_MAX_Y - margin),
    };
  }

  moveTo(x, y, onArrive) {
    this.cancelMining();
    this.tweens.killTweensOf(this.player);
    const target = this.clampToRoom(x, y);
    const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, target.x, target.y);

    if (dist < 2) {
      if (onArrive) onArrive();
      return;
    }

    this.player.setFlipX(target.x < this.player.x);
    const duration = (dist / MOVE_SPEED) * 1000;
    this.tweens.add({
      targets: this.player,
      x: target.x,
      y: target.y,
      duration,
      onUpdate: () => this.player.setDepth(this.player.y),
      onComplete: () => { if (onArrive) onArrive(); },
    });
  }

  onOreClicked(cluster) {
    if (cluster.broken) return;
    const dx = this.player.x - cluster.sprite.x;
    const dy = this.player.y - cluster.sprite.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ax = cluster.sprite.x + (dx / dist) * MINE_APPROACH_DIST;
    const ay = cluster.sprite.y + (dy / dist) * MINE_APPROACH_DIST;
    this.moveTo(ax, ay, () => this.beginChannel(cluster));
  }

  onShopClicked() {
    if (this.shopOpen) return;
    const dx = this.player.x - this.shopSprite.x;
    const dy = this.player.y - this.shopSprite.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ax = this.shopSprite.x + (dx / dist) * SHOP_APPROACH_DIST;
    const ay = this.shopSprite.y + (dy / dist) * SHOP_APPROACH_DIST;
    this.moveTo(ax, ay, () => this.openShop());
  }

  beginChannel(cluster) {
    if (cluster.broken) return;
    this.miningTarget = cluster;
    this.mineProgress = 0;
    this.gaugeBg.setVisible(true);
    this.gaugeFill.setVisible(true);
    this.swingTween = this.tweens.add({
      targets: this.player,
      scaleX: 1.15, scaleY: 0.88,
      duration: 180,
      yoyo: true,
      repeat: -1,
    });
  }

  cancelMining() {
    this.miningTarget = null;
    this.mineProgress = 0;
    if (this.gaugeBg) { this.gaugeBg.setVisible(false); this.gaugeFill.setVisible(false); }
    if (this.swingTween) { this.swingTween.stop(); this.swingTween = null; this.player.setScale(1, 1); }
  }

  currentCycleMs() {
    return Math.max(500, BASE_CYCLE_MS - (this.pickaxeLevel - 1) * 150);
  }

  rollOreType() {
    const bonus = (this.pickaxeLevel - 1) * 2; // 곡괭이 레벨당 희귀 확률 소폭 증가
    const weights = {
      iron: Math.max(10, ORE_TYPES.iron.weight - bonus * 1.5),
      silver: ORE_TYPES.silver.weight + bonus,
      mithril: ORE_TYPES.mithril.weight + bonus * 0.5,
    };
    const total = weights.iron + weights.silver + weights.mithril;
    let r = Math.random() * total;
    for (const key of ["iron", "silver", "mithril"]) {
      if (r < weights[key]) return key;
      r -= weights[key];
    }
    return "iron";
  }

  resolveMiningTick(cluster) {
    this.pickaxeDurability = Math.max(0, this.pickaxeDurability - 1);
    this.sp = Math.max(0, this.sp - SP_COST_PER_CYCLE);
    cluster.uses -= 1;

    const oreKey = this.rollOreType();
    this.spawnGroundItem(cluster.sprite.x, cluster.sprite.y, oreKey);
    this.gainExp(4);
    this.spawnRockChips(cluster.sprite.x, cluster.sprite.y);
    this.cameras.main.shake(100, 0.0015);
    this.updateUI();
    this.saveGame();

    if (cluster.uses <= 0) {
      this.breakRock(cluster);
      this.cancelMining();
    }
  }

  /** 암반을 완전히 파괴한다 - 스프라이트를 제거해 원래 깔려있던 바닥이 드러나며 통로가 된다. */
  breakRock(cluster) {
    cluster.broken = true;
    cluster.sprite.destroy();
    this.addLog("암반을 부쉈습니다! 길이 뚫렸습니다.", "#c9a86b");
  }

  /** 채굴 타격마다 그 자리에 광물 아이템을 떨어뜨린다. 슬라임이 다가가 밟으면 collectGroundItems()가 자동으로 줍는다. */
  spawnGroundItem(x, y, oreKey) {
    const ore = ORE_TYPES[oreKey];
    const ox = x + Phaser.Math.Between(-16, 16);
    const oy = y - 4 + Phaser.Math.Between(-8, 8);
    const sprite = this.add.image(ox, oy, "ore_item")
      .setDisplaySize(ORE_ITEM_DISPLAY * 0.55, ORE_ITEM_DISPLAY * 0.55)
      .setOrigin(0.5, ORE_ITEM_ORIGIN_Y)
      .setDepth(oy)
      .setTint(ore.color);
    this.tweens.add({ targets: sprite, y: oy - 6, duration: 480, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
    this.groundItems.push({ sprite, oreKey, warned: false });
  }

  /** 매 프레임 슬라임과의 거리를 검사해 가까이 있는 드랍 아이템을 가방에 자동으로 담는다. */
  collectGroundItems() {
    for (let i = this.groundItems.length - 1; i >= 0; i--) {
      const item = this.groundItems[i];
      const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, item.sprite.x, item.sprite.y);
      if (dist > PICKUP_RADIUS) continue;

      const total = this.inventory.iron + this.inventory.silver + this.inventory.mithril;
      if (total >= this.bagCapacity) {
        if (!item.warned) {
          this.addLog("가방이 가득 찼습니다! 상점에서 판매하고 오세요.", "#ff9a76");
          item.warned = true;
        }
        continue;
      }

      const ore = ORE_TYPES[item.oreKey];
      this.inventory[item.oreKey] += 1;
      this.addLog(`${ore.name} 1개 획득`, ore.logColor);
      this.spawnSparkle(item.sprite.x, item.sprite.y, ore.color);
      this.tweens.killTweensOf(item.sprite);
      item.sprite.destroy();
      this.groundItems.splice(i, 1);
      this.updateUI();
      this.saveGame();
    }
  }

  gainExp(amount) {
    this.expPercent += amount;
    while (this.expPercent >= 100) {
      this.expPercent -= 100;
      this.level += 1;
      this.maxSP += 5;
      this.maxHP += 10;
      this.hp = this.maxHP;
      this.sp = this.maxSP;
      this.addLog(`레벨업! Lv.${this.level} 달성!`, "#ffe066");
    }
  }

  spawnSparkle(x, y, color) {
    // ore_item.png는 500px 원본이라 파티클 스케일을 아주 작게 잡아야 알갱이처럼 보인다.
    const emitter = this.add.particles(x, y, "ore_item", {
      speed: { min: 30, max: 100 },
      angle: { min: 200, max: 340 },
      scale: { start: 0.055, end: 0 },
      lifespan: 350,
      gravityY: 300,
      quantity: 8,
      tint: color,
    }).setDepth(1001);
    emitter.explode(8);
    this.time.delayedCall(400, () => emitter.destroy());
  }

  /** 타격 순간 사방으로 튀는 작은 바위 파편 (채굴 손맛 강화) */
  spawnRockChips(x, y) {
    const count = Phaser.Math.Between(3, 5);
    // rock.png는 732px 원본이라 파티클 스케일을 아주 작게 잡아야 잔돌처럼 보인다.
    const emitter = this.add.particles(x, y, "rock", {
      speed: { min: 60, max: 160 },
      angle: { min: 0, max: 360 },
      scale: { start: 0.022, end: 0 },
      lifespan: 300,
      gravityY: 500,
      quantity: count,
      tint: 0x8a7a63,
    }).setDepth(1001);
    emitter.explode(count);
    this.time.delayedCall(350, () => emitter.destroy());
  }

  /** 랜턴 불빛이 닿는 암반에서 가끔씩 반짝이는 앰비언트 스파클 */
  ambientSparkle() {
    this.rockBlocks.forEach((cluster) => {
      if (cluster.broken) return;
      const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, cluster.sprite.x, cluster.sprite.y);
      if (dist > 190) return; // 조명이 닿는 범위 밖이면 반짝이지 않는다
      if (Math.random() > 0.35) return;
      const ox = cluster.sprite.x + Phaser.Math.Between(-10, 10);
      const oy = cluster.sprite.y + Phaser.Math.Between(-10, 10);
      const emitter = this.add.particles(ox, oy, "ore_item", {
        speed: { min: 5, max: 20 },
        scale: { start: 0.02, end: 0 },
        lifespan: 500,
        quantity: 1,
        tint: 0xffffff,
      }).setDepth(cluster.sprite.depth + 1);
      emitter.explode(1);
      this.time.delayedCall(600, () => emitter.destroy());
    });
  }

  /* =========================================================================
     상점
     ========================================================================= */

  openShop() {
    this.shopOpen = true;
    this.cancelMining();
    this.tweens.killTweensOf(this.player);
    document.getElementById("shop-modal").style.display = "flex";
    document.getElementById("shop-msg").textContent = "";
    this.refreshShopUI();
  }

  closeShop() {
    this.shopOpen = false;
    document.getElementById("shop-modal").style.display = "none";
    this.saveGame();
  }

  refreshShopUI() {
    const total = this.inventory.iron + this.inventory.silver + this.inventory.mithril;
    document.getElementById("shop-gold").textContent = `${this.gold}G`;
    document.getElementById("shop-bag").textContent = `${total}/${this.bagCapacity}`;
    document.getElementById("shop-pickaxe").textContent =
      `Lv.${this.pickaxeLevel} (${this.pickaxeDurability}/${this.pickaxeMaxDurability})`;

    const sellValue = this.inventory.iron * ORE_TYPES.iron.sell
      + this.inventory.silver * ORE_TYPES.silver.sell
      + this.inventory.mithril * ORE_TYPES.mithril.sell;
    document.getElementById("cost-sell").textContent = total > 0 ? `+${sellValue}G` : "-";
    document.getElementById("btn-sell").disabled = total <= 0;

    const missing = this.pickaxeMaxDurability - this.pickaxeDurability;
    const repairCost = missing * 2;
    document.getElementById("cost-repair").textContent = missing > 0 ? `${repairCost}G` : "완료";
    document.getElementById("btn-repair").disabled = missing <= 0 || this.gold < repairCost;

    const nextTier = this.upgradeTiers.find((t) => t.level === this.pickaxeLevel + 1);
    const upgradeBtn = document.getElementById("btn-upgrade");
    if (nextTier) {
      document.getElementById("cost-upgrade").textContent = `${nextTier.cost}G`;
      upgradeBtn.disabled = this.gold < nextTier.cost;
    } else {
      document.getElementById("cost-upgrade").textContent = "MAX";
      upgradeBtn.disabled = true;
    }

    const nextBagCap = this.bagTiers[this.bagLevel + 1];
    const expandBtn = document.getElementById("btn-expand");
    if (nextBagCap) {
      const cost = this.bagCosts[this.bagLevel + 1];
      document.getElementById("cost-expand").textContent = `${cost}G`;
      expandBtn.disabled = this.gold < cost;
    } else {
      document.getElementById("cost-expand").textContent = "MAX";
      expandBtn.disabled = true;
    }
  }

  sellAll() {
    const value = this.inventory.iron * ORE_TYPES.iron.sell
      + this.inventory.silver * ORE_TYPES.silver.sell
      + this.inventory.mithril * ORE_TYPES.mithril.sell;
    if (value <= 0) return;
    this.gold += value;
    this.inventory.iron = 0;
    this.inventory.silver = 0;
    this.inventory.mithril = 0;
    document.getElementById("shop-msg").textContent = `${value}G 를 받았습니다.`;
    this.updateUI();
    this.saveGame();
  }

  repairPickaxe() {
    const missing = this.pickaxeMaxDurability - this.pickaxeDurability;
    const cost = missing * 2;
    if (missing <= 0 || this.gold < cost) return;
    this.gold -= cost;
    this.pickaxeDurability = this.pickaxeMaxDurability;
    document.getElementById("shop-msg").textContent = "곡괭이를 수리했습니다!";
    this.updateUI();
    this.saveGame();
  }

  upgradePickaxe() {
    const nextTier = this.upgradeTiers.find((t) => t.level === this.pickaxeLevel + 1);
    if (!nextTier || this.gold < nextTier.cost) return;
    this.gold -= nextTier.cost;
    this.pickaxeLevel = nextTier.level;
    document.getElementById("shop-msg").textContent = `곡괭이가 Lv.${this.pickaxeLevel}로 강화되었습니다!`;
    this.updateUI();
    this.saveGame();
  }

  expandBag() {
    const nextCap = this.bagTiers[this.bagLevel + 1];
    const cost = this.bagCosts[this.bagLevel + 1];
    if (!nextCap || this.gold < cost) return;
    this.gold -= cost;
    this.bagLevel += 1;
    this.bagCapacity = nextCap;
    document.getElementById("shop-msg").textContent = `가방이 ${this.bagCapacity}칸으로 확장되었습니다!`;
    this.updateUI();
    this.saveGame();
  }

  /* =========================================================================
     채팅 로그 / 가방 팝업 / UI 갱신
     ========================================================================= */

  addLog(text, color = "#ffffff", tab = "general") {
    this.chatMessages.push({ text, color, tab });
    if (this.chatMessages.length > 200) this.chatMessages.shift();
    this.renderChatLog();
  }

  renderChatLog() {
    const box = document.getElementById("chat-log");
    if (!box) return;
    const filtered = this.chatMessages.filter((m) => m.tab === this.activeTab);
    box.innerHTML = filtered.map((m) => `<div style="color:${m.color}">${m.text}</div>`).join("");
    box.scrollTop = box.scrollHeight;
  }

  openInventory() {
    const total = this.inventory.iron + this.inventory.silver + this.inventory.mithril;
    document.getElementById("inventory-body").innerHTML = `
      <div class="inv-row"><span>골드</span><span>${this.gold}G</span></div>
      <div class="inv-row"><span>가방</span><span>${total}/${this.bagCapacity}</span></div>
      <hr>
      <div class="inv-row"><span>🟫 철 광석</span><span>${this.inventory.iron}</span></div>
      <div class="inv-row"><span>⚪ 은 광석</span><span>${this.inventory.silver}</span></div>
      <div class="inv-row"><span>🟣 미스릴</span><span>${this.inventory.mithril}</span></div>
    `;
    document.getElementById("inventory-modal").style.display = "block";
  }

  updateUI() {
    // 상태창
    document.getElementById("stat-level").textContent = this.level;
    document.getElementById("stat-exp").textContent = Math.floor(this.expPercent * 10) / 10;
    document.getElementById("hp-text").textContent = `${this.hp}/${this.maxHP}`;
    document.getElementById("sp-text").textContent = `${Math.floor(this.sp)}/${this.maxSP}`;
    document.getElementById("hp-bar").style.width = `${(this.hp / this.maxHP) * 100}%`;
    document.getElementById("sp-bar").style.width = `${(this.sp / this.maxSP) * 100}%`;

    // 퀵슬롯 곡괭이 내구도
    document.getElementById("pickaxe-durability").textContent =
      `${this.pickaxeDurability}/${this.pickaxeMaxDurability}`;

    if (this.shopOpen) this.refreshShopUI();
    if (document.getElementById("inventory-modal").style.display === "block") this.openInventory();
  }

  drawMinimap() {
    const canvas = document.getElementById("minimap-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0c0a08";
    ctx.fillRect(0, 0, w, h);
    const sx = w / ROOM_W, sy = h / ROOM_H;

    this.rockBlocks.forEach((c) => {
      if (c.broken) return;
      ctx.fillStyle = "#8a5fd8";
      ctx.beginPath();
      ctx.arc(c.sprite.x * sx, c.sprite.y * sy, 2, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(this.shopSprite.x * sx, this.shopSprite.y * sy, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#5fd068";
    ctx.beginPath();
    ctx.arc(this.player.x * sx, this.player.y * sy, 3, 0, Math.PI * 2);
    ctx.fill();

    document.getElementById("coord-text").textContent =
      `(${Math.round(this.player.x)}, ${Math.round(this.player.y)})`;
  }

  /* =========================================================================
     자동 저장 / 불러오기
     ========================================================================= */

  loadSaveData() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.warn("세이브 데이터를 불러오지 못했습니다.", e);
      return null;
    }
  }

  saveGame() {
    const data = {
      version: 2,
      gold: this.gold,
      bagLevel: this.bagLevel,
      pickaxeLevel: this.pickaxeLevel,
      pickaxeDurability: this.pickaxeDurability,
      inventory: { ...this.inventory },
      level: this.level,
      expPercent: this.expPercent,
      maxHP: this.maxHP, hp: this.hp,
      maxSP: this.maxSP, sp: this.sp,
      playerX: this.player.x,
      playerY: this.player.y,
    };
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn("게임 저장에 실패했습니다.", e);
    }
  }

  /* ---- 매 프레임 실행 ---- */
  update(time, delta) {
    // 기력(SP) 자연 회복 - 채굴 중이 아닐 때만
    if (!this.miningTarget && this.sp < this.maxSP) {
      this.sp = Math.min(this.maxSP, this.sp + (SP_REGEN_PER_SEC * delta) / 1000);
      if (Math.floor(this.sp) !== this._lastSpDisplay) {
        this._lastSpDisplay = Math.floor(this.sp);
        this.updateUI();
      }
    }

    if (this.miningTarget) {
      const cluster = this.miningTarget;

      if (this.pickaxeDurability <= 0) {
        this.addLog("곡괭이가 망가졌습니다! 거점 상점에서 수리하세요.", "#ff9a76");
        this.cancelMining();
      } else if (this.sp < SP_COST_PER_CYCLE) {
        this.addLog("기력이 부족합니다. 잠시 휴식하세요.", "#ff9a76");
        this.cancelMining();
      } else {
        this.mineProgress += delta;
        const ratio = Phaser.Math.Clamp(this.mineProgress / this.currentCycleMs(), 0, 1);
        const gaugeY = this.player.y - SLIME_DISPLAY * SLIME_ORIGIN_Y - 14; // 슬라임 머리 위
        this.gaugeBg.setPosition(this.player.x - 20, gaugeY);
        this.gaugeFill.setPosition(this.player.x - 20, gaugeY);
        this.gaugeFill.setSize(40 * ratio, 6);

        if (this.mineProgress >= this.currentCycleMs()) {
          this.mineProgress = 0;
          this.resolveMiningTick(cluster);
        }
      }
    }

    this.collectGroundItems();

    // 조명 + 안개(Fog of War) 갱신 - 플레이어 랜턴을 따라다니는 원형 시야만 밝힌다
    this.playerLight.setPosition(this.player.x, this.player.y);
    this.fog.clear();
    this.fog.fill(0x05030a, 0.86);
    this.lampSpots.forEach(([lx, ly]) => {
      this.lightStampLamp.setPosition(lx, ly).setScale(2.0);
      this.fog.erase(this.lightStampLamp);
    });
    this.lightStampPlayer.setPosition(this.player.x, this.player.y).setScale(3.6);
    this.fog.erase(this.lightStampPlayer);

    this.drawMinimap();
  }
}

/* -------------------------------------------------------------------------
   4. Phaser 게임 설정 및 실행
   ------------------------------------------------------------------------- */
const config = {
  type: Phaser.AUTO,
  parent: "game-container",
  width: ROOM_W,
  height: ROOM_H,
  backgroundColor: "#100c08",
  pixelArt: true,
  scene: [MineScene],
};

new Phaser.Game(config);

/* -------------------------------------------------------------------------
   5. DOM UI 바인딩 (상태창 닫기, 가방, 상점 버튼, 채팅 탭)
   ------------------------------------------------------------------------- */
document.getElementById("status-close").addEventListener("click", () => {
  document.getElementById("status-window").style.display = "none";
  document.getElementById("status-reopen").style.display = "block";
});
document.getElementById("status-reopen").addEventListener("click", () => {
  document.getElementById("status-window").style.display = "block";
  document.getElementById("status-reopen").style.display = "none";
});

document.getElementById("btn-inventory").addEventListener("click", () => {
  const modal = document.getElementById("inventory-modal");
  if (modal.style.display === "block") { modal.style.display = "none"; }
  else { window.gameScene?.openInventory(); }
});
document.getElementById("inv-close").addEventListener("click", () => {
  document.getElementById("inventory-modal").style.display = "none";
});
document.getElementById("btn-equip").addEventListener("click", () => {
  window.gameScene?.addLog("장비창은 아직 준비 중입니다.", "#aaaaaa");
});
document.getElementById("btn-skill").addEventListener("click", () => {
  window.gameScene?.addLog("스킬북은 아직 준비 중입니다.", "#aaaaaa");
});

document.querySelectorAll(".chat-tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".chat-tab").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    if (window.gameScene) {
      window.gameScene.activeTab = btn.dataset.tab;
      window.gameScene.renderChatLog();
    }
  });
});

document.getElementById("btn-sell").addEventListener("click", () => window.gameScene?.sellAll());
document.getElementById("btn-repair").addEventListener("click", () => window.gameScene?.repairPickaxe());
document.getElementById("btn-upgrade").addEventListener("click", () => window.gameScene?.upgradePickaxe());
document.getElementById("btn-expand").addEventListener("click", () => window.gameScene?.expandBag());
document.getElementById("btn-close-shop").addEventListener("click", () => window.gameScene?.closeShop());

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && window.gameScene?.shopOpen) {
    window.gameScene.closeShop();
  }
});
</script>
